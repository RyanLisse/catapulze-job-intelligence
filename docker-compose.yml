---
name: catapulze-job-intelligence

services:
  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    ports:
      - target: 5432
        published: "${POSTGRES_HOST_PORT:-5432}"
        host_ip: 127.0.0.1
        protocol: tcp
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?POSTGRES_ADMIN_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_MIGRATOR_USER: ${POSTGRES_MIGRATOR_USER:?POSTGRES_MIGRATOR_USER is required}
      POSTGRES_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?POSTGRES_MIGRATOR_PASSWORD is required}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:?POSTGRES_APP_USER is required}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./tools/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    cpus: "${POSTGRES_CPU_LIMIT:-2.0}"
    mem_limit: "${POSTGRES_MEMORY_LIMIT:-4g}"
    mem_reservation: "${POSTGRES_MEMORY_RESERVATION:-1g}"
    shm_size: "${POSTGRES_SHM_SIZE:-512m}"
    stop_grace_period: 1m
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-http://localhost:3000}
    init: true
    ports:
      - "3001:3001"
    env_file:
      - path: apps/web/.env
        required: false
    environment:
      SERVER_URL: http://server:3000
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-http://localhost:3000}
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - target: 6379
        published: "${REDIS_HOST_PORT:-6379}"
        host_ip: 127.0.0.1
        protocol: tcp
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    cpus: "0.5"
    mem_limit: 256m
    restart: unless-stopped

  manticore:
    image: manticoresearch/manticore:6.3.8
    ports:
      - target: 9308
        published: "${MANTICORE_HTTP_PORT:-9308}"
        host_ip: 127.0.0.1
        protocol: tcp
      - target: 9306
        published: "${MANTICORE_MYSQL_PORT:-9306}"
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - manticore_data:/var/lib/manticore
      # Writable bind mount: the official entrypoint chowns /etc/manticoresearch before
      # dropping to the manticore user; :ro makes that chown fail and crash-loops searchd.
      - ./tools/manticore/manticore.conf:/etc/manticoresearch/manticore.conf
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysql -h127.0.0.1 -P9306 -e 'SHOW TABLES' | grep -q aanvragen",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    cpus: "1.0"
    mem_limit: 1g
    restart: unless-stopped

  # RJC-382: shadow instance for evaluating Manticore 29.x (native hybrid
  # search — BM25+KNN with RRF fusion) against the pinned 6.3.8 production
  # instance above, side by side. Gated behind the "shadow" profile, so a
  # plain `docker compose up` (no profile) never starts it — only
  # `docker compose up -d manticore29` (explicitly targeting it activates
  # its profile) or `docker compose --profile shadow up -d` do. See
  # tools/manticore/README-29-shadow.md for the comparison plan. The
  # production `manticore` service above must stay byte-identical.
  manticore29:
    profiles: ["shadow"]
    image: manticoresearch/manticore:29.0.2@sha256:647ff5da4de6361eb043417a8f19b9e05041d3cfa1c3566665c07bc872cd15c3
    ports:
      - target: 9308
        published: "${MANTICORE29_HTTP_PORT:-9312}"
        host_ip: 127.0.0.1
        protocol: tcp
      - target: 9306
        published: "${MANTICORE29_MYSQL_PORT:-9313}"
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - manticore29_data:/var/lib/manticore
      # Writable bind mount: same reason as the 6.3.8 service — the official
      # entrypoint chowns /etc/manticoresearch before dropping to the
      # manticore user; :ro makes that chown fail and crash-loops searchd.
      - ./tools/manticore/manticore29.conf:/etc/manticoresearch/manticore.conf
    healthcheck:
      # Table-independent on purpose (unlike the 6.3.8 healthcheck above,
      # which greps for the aanvragen table): this service starts with an
      # empty RT table set on a fresh volume — the probe script creates
      # aanvragen itself after startup — so a table-existence check would
      # never pass and `docker compose up -d --wait manticore29` would hang
      # until timeout. `SELECT 1` only proves searchd itself is answering.
      test: ["CMD-SHELL", "mysql -h127.0.0.1 -P9306 -e 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    cpus: "1.0"
    mem_limit: 1g
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    init: true
    ports:
      - "3000:3000"
    env_file:
      - path: apps/server/.env
        required: false
    environment:
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL is required}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
      DATABASE_URL: ${CATAPULZE_DATABASE_URL:?CATAPULZE_DATABASE_URL is required}
      MANTICORE_URL: ${MANTICORE_URL:-http://manticore:9308}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    depends_on:
      postgres:
        condition: service_healthy
      manticore:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:3000/readyz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # RJC-386: local S3-compatible target for the durable raw object store.
  # Opt-in via `--profile storage` — never started by a plain `docker
  # compose up`, and never part of the app services above.
  #
  # Named distinctly from docker-compose.backup.yml's own `minio`/`minio-init`
  # (a separate, pre-existing WAL-G backup-drill overlay on port 9000): a
  # same-named service here would deep-merge with that overlay's definition
  # whenever both files are combined (its own documented usage is
  # `-f docker-compose.yml -f docker-compose.backup.yml`), silently changing
  # an already-working, unrelated feature. Kept fully independent instead.
  raw-storage-minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    profiles: ["storage"]
    command: server /data --console-address ":9001"
    ports:
      - target: 9000
        published: "${RAW_STORAGE_MINIO_API_PORT:-9002}"
        host_ip: 127.0.0.1
        protocol: tcp
      - target: 9001
        published: "${RAW_STORAGE_MINIO_CONSOLE_PORT:-9003}"
        host_ip: 127.0.0.1
        protocol: tcp
    environment:
      # ponytail: well-known local-only MinIO defaults, never used against a
      # real bucket — see apps/server/.env.example and apps/worker/.env.example.
      MINIO_ROOT_USER: ${RAW_STORAGE_MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${RAW_STORAGE_MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - raw_storage_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # RJC-387: on-box search projector, standing in locally for the process
  # that runs next to Manticore in production (docs/runbooks/search-projector.md).
  # Opt-in via `--profile projector` — never started by a plain `docker
  # compose up`. Talks to the same postgres/manticore services above, over
  # the compose network rather than TLS/loopback like production.
  projector:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    profiles: ["projector"]
    init: true
    command: ["bun", "run", "projector"]
    environment:
      DATABASE_URL: ${CATAPULZE_DATABASE_URL:?CATAPULZE_DATABASE_URL is required}
      MANTICORE_URL: http://manticore:9308
    depends_on:
      postgres:
        condition: service_healthy
      manticore:
        condition: service_healthy
    restart: unless-stopped

  # One-shot bucket bootstrap: creates `ji-raw-local` and exits. Re-running
  # `up --profile storage` is idempotent (`mc mb --ignore-existing`).
  raw-storage-minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z-cpuv1
    profiles: ["storage"]
    depends_on:
      raw-storage-minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${RAW_STORAGE_MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${RAW_STORAGE_MINIO_ROOT_PASSWORD:-minioadmin}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://raw-storage-minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing local/ji-raw-local
    restart: "no"

volumes:
  postgres_data:
    external: true
    name: ${POSTGRES_DATA_VOLUME:-catapulze-postgres-p0}
  raw_storage_minio_data:
  manticore_data:
  manticore29_data:
