---
name: CI

"on":
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: "1.3.14"

      - name: Install Qlty
        uses: qltysh/qlty-action/install@08a0a862c159eae9b9003081da6663d96efef637  # v2.3.0

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Start isolated PostgreSQL
        env:
          POSTGRES_DATA_VOLUME: catapulze-postgres-ci
        run: |
          docker volume create "$POSTGRES_DATA_VOLUME"
          docker compose --env-file .env.example up -d --wait postgres

      - name: Verify
        run: bun run gate

      - name: Build
        run: bun run build -- --concurrency=2

      - name: Stop isolated PostgreSQL
        if: always()
        env:
          POSTGRES_DATA_VOLUME: catapulze-postgres-ci
        run: |
          docker compose --env-file .env.example down -v
          docker volume rm "$POSTGRES_DATA_VOLUME"
